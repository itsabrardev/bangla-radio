<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e31837"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Radio body -->
  <rect x="8" y="22" width="48" height="30" rx="5" fill="#1e2640" stroke="#2d3461" stroke-width="1.5"/>
  <!-- Antenna -->
  <line x1="48" y1="22" x2="54" y2="8" stroke="#e31837" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Speaker grille lines -->
  <line x1="14" y1="32" x2="32" y2="32" stroke="#2d3461" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="36" x2="32" y2="36" stroke="#2d3461" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="40" x2="32" y2="40" stroke="#2d3461" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="44" x2="32" y2="44" stroke="#2d3461" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tuner knob -->
  <circle cx="45" cy="38" r="7" fill="#0a0e1a" stroke="#e31837" stroke-width="1.5"/>
  <circle cx="45" cy="38" r="2.5" fill="url(#wave)"/>
  <!-- Signal waves -->
  <path d="M 4 14 Q 10 10 16 14" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 1 10 Q 10 4 19 10" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- LED indicator -->
  <circle cx="20" cy="27" r="2" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>